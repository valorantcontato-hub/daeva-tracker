<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lotus Tracker</title>
  <meta name="description" content="Tracker leve para AION 2: DPS da party, dano por skill e bestiário de farm.">
  <meta name="theme-color" content="#0d0b14">
  <link id="app-icon" rel="icon" href="icons/lotus-dark.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/shell.css">
  <script>
    document.documentElement.dataset.theme = 'dark';
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="Lotus Tracker"><span class="brand-mark" aria-hidden="true"></span><b>Lotus</b><span>Tracker</span></a>

    <span class="spacer"></span>
    <div class="lang-switch" role="group" aria-label="Idioma">
      <button data-lang="pt-BR" title="Português">PT</button>
      <button data-lang="en-US" title="English">EN</button>
    </div>
    <div class="win-controls" aria-label="Janela">
      <button class="win-btn" id="win-min" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg></button>
      <button class="win-btn close" id="win-close" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>
    <nav class="tabs" aria-label="Seções"><span class="nav-caption">Menu</span>
      <a href="#/inicio" data-route="inicio" title="Início" aria-label="Início"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Início</span></a>
      <a href="#/boss" data-route="boss" title="Boss" aria-label="Boss"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 3 8 8M3 3l1 5 4-4-5-1Zm17 0-8 8m9-8-1 5-4-4 5-1ZM9 14l-5 5m11-5 5 5M3 17l4 4m10 0 4-4"/></svg><span class="nav-label">Boss</span></a>
      <a href="#/treinamento" data-route="treinamento" title="Boneco de Treinamento" aria-label="Boneco de Treinamento"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="nav-label">Boneco de Treinamento</span></a>
      <a href="#/bestiario" data-route="bestiario" title="Bestiário" aria-label="Bestiário"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="6" ry="5"/><ellipse cx="5" cy="8" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="16" cy="5" rx="2" ry="3"/><ellipse cx="21" cy="9" rx="2" ry="3"/></svg><span class="nav-label">Bestiário</span></a>
      <a href="#/conta" data-route="conta" title="Conta" aria-label="Conta"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="nav-label">Conta</span></a>
      <a href="#/widgets" data-route="widgets" title="Widgets" aria-label="Widgets"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="nav-label">Widgets</span></a>
    </nav>
  <div id="app-banner" class="app-banner" role="status" hidden></div>
  <main id="view"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
