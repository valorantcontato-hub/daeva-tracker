<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daeva Tracker</title>
  <meta name="description" content="Tracker leve para AION 2: DPS da party, dano por skill e bestiário de farm.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16Z' fill='%235eead4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema antes do primeiro paint para evitar flash.
    try {
      const t = JSON.parse(localStorage.getItem('a2t:theme'));
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inicio"><span class="brand-mark">◆</span>Daeva<span>Tracker</span></a>
    <nav class="tabs" aria-label="Seções">
      <a href="#/inicio" data-route="inicio"><span class="tab-ico">◆</span>Início</a>
      <a href="#/dps" data-route="dps"><span class="tab-ico">⚔</span>DPS</a>
      <a href="#/daevanion" data-route="daevanion"><span class="tab-ico">✧</span>Daevanion</a>
      <a href="#/skills" data-route="skills"><span class="tab-ico">✦</span>Skills</a>
      <a href="#/bestiario" data-route="bestiario"><span class="tab-ico">🐾</span>Bestiário</a>
      <a href="#/conta" data-route="conta"><span class="tab-ico">👤</span>Conta</a>
      <a href="#/widgets" data-route="widgets"><span class="tab-ico">▣</span>Widgets</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon-btn" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">◐</button>
  </header>
  <div id="app-banner" class="app-banner" role="status" hidden></div>
  <main id="view"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
