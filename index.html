<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lotus</title>
  <meta name="description" content="Tracker leve para AION 2: DPS da party, dano por skill e bestiário de farm.">
  <meta name="theme-color" content="#0e1116">
  <link id="app-icon" rel="icon" type="image/svg+xml" href="icons/lotus-dark.svg?v=blue">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="Lotus"><span class="brand-mark" aria-hidden="true"></span><b>Lotus</b></a>
    <nav class="tabs" aria-label="Seções">
      <a href="#/inicio" data-route="inicio"><span class="tab-ico"><svg class="ico-home" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h5v-5.5h3v5.5h5V10"/></svg></span>Início</a>
      <a href="#/favoritos" data-route="favoritos"><span class="tab-ico">☆</span>Favoritos</a>
      <a href="#/bestiario" data-route="bestiario"><span class="tab-ico">🐾</span>Mascotes</a>
      <a href="#/boss" data-route="boss"><span class="tab-ico">⚔</span>Boss</a>
      <a href="#/treinamento" data-route="treinamento" aria-label="Boneco de Treinamento"><span class="tab-ico">◎</span><span class="training-nav-label">Treino</span></a>
      <a href="#/widgets" data-route="widgets"><span class="tab-ico">▣</span>Widgets</a>
    </nav>
    <span class="spacer"></span>
    <div class="lang-switch" role="group" aria-label="Idioma">
      <button data-lang="pt-BR" title="Português">PT</button>
      <button data-lang="en-US" title="English">EN</button>
    </div>
    <div class="win-controls" aria-label="Janela">
      <button class="win-btn" id="win-min" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg></button>
      <button class="win-btn close" id="win-close" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>
  <div id="app-banner" class="app-banner" role="status" hidden></div>
  <main id="view"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
