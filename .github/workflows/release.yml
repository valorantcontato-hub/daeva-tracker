# Publica uma nova versão do Daeva Tracker no GitHub Releases; os apps instalados baixam sozinhos.
#  - push no main mexendo no app (Electron, servidor, captura, dependências): versão patch nova.
#    Mudanças só de interface (index.html, css/, js/, icons/) NÃO precisam de versão: o app
#    instalado baixa essas na hora (electron/live-ui.mjs).
#  - a cada 6 horas: se o motor de captura (Aion2DpsMeter) mudou — ex.: opcodes após um patch
#    do jogo — gera uma versão nova.
#  - tag v*: versão manual (git tag v0.2.0 && git push --tags).
#  - manual: Actions > Release > Run workflow.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'server.mjs'
      - 'js/encounter.js'
      - 'js/util.js'
      - 'capture/**'
      - 'package.json'
      - 'package-lock.json'
    tags: ['v*']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão e motor
        id: plan
        shell: pwsh
        run: |
          $engine = (git ls-remote https://github.com/domel1998/Aion2DPSMeter.git HEAD).Split("`t")[0].Substring(0, 7)
          $latest = $null
          try { $latest = gh release view --json tagName,body 2>$null | ConvertFrom-Json } catch { }
          # Sem release ainda (primeira vez), o gh sai com 1; não deixa isso falhar o passo.
          $global:LASTEXITCODE = 0
          $tag = $latest.tagName
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME.TrimStart('v')
          } elseif ($env:EVENT -eq 'schedule' -and $latest -and $latest.body -match "engine: $engine") {
            Write-Host "Motor $engine já publicado em $tag. Nada a fazer."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          } else {
            $base = if ($tag) { [version]$tag.TrimStart('v') } else { [version]((Get-Content package.json | ConvertFrom-Json).version) }
            $version = "$($base.Major).$($base.Minor).$($base.Build + 1)"
          }
          "skip=false" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "engine=$engine" >> $env:GITHUB_OUTPUT

      - if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - if: steps.plan.outputs.skip == 'false'
        name: Build e publicação
        shell: pwsh
        run: |
          npm ci
          npm version ${{ steps.plan.outputs.version }} --no-git-tag-version --allow-same-version
          node tools/set-publish.mjs ${{ github.repository_owner }} ${{ github.event.repository.name }}
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engineDir = Join-Path $env:LOCALAPPDATA 'DaevaTracker\engine\Aion2DPSMeter'
          dotnet run --project tests/capture/CaptureTests.csproj "-p:EngineDir=$engineDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Cria tag + release antes: o electron-builder só envia os arquivos (evita corrida ao criar a release).
          $tag = "v${{ steps.plan.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Atualização automática (motor de captura: engine: ${{ steps.plan.outputs.engine }})"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $global:LASTEXITCODE = 0
          npx electron-builder --win --publish always
